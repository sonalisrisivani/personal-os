services:
  # Next.js Frontend
  - type: web
    name: personal-os-web
    runtime: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: personal-os-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_VERSION
        value: 22

  # FastAPI Backend
  - type: web
    name: personal-os-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personal-os-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  # PostgreSQL Database
  - name: personal-os-db
    databaseName: personal_os
    user: personal_os
    plan: free
